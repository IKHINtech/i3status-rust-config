[theme]
theme = "slick"

[icons]
icons = "awesome6"

[icons.overrides]
cpu = ""
cpu_idle = "⚙"
cpu_warning = "⚡"
cpu_critical = "🔥"
disk = ""
memory_idle = "🌿"
memory_warning = "🍂"
memory_critical = "💥"
net_up = "󰖩"
net_down = "󰖪"
plug = ""
bat = ""
bat_charging = ""

# Time
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/time.sh"
interval = 10
json = true

# Now playing (MPRIS)
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/nowplaying.sh"
interval = 2
json = true

# Load average
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/load.sh"
interval = 3
json = true

# Disk usage
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/disk.sh"
interval = 30
json = true

# Network
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/network.sh"
interval = 5
json = true

# Battery / AC
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/battery.sh"
interval = 15
json = true

# CPU usage
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/cpu.sh"
interval = 2
json = true

# Memory usage
[[block]]
block = "custom"
command = "~/.config/i3status-rust/scripts/mem.sh"
interval = 5
json = true
